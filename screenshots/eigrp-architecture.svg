<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="100%" stop-color="#081021" />
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101e3f" />
      <stop offset="100%" stop-color="#081022" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1000" height="650" fill="url(#bgGrad)" />

  <text x="500" y="45" fill="#f8fafc" font-family="-apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle">DUAL (Diffusing Update Algorithm) Feasibility Condition ($AD &lt; FD$)</text>
  <text x="500" y="70" fill="#94a3b8" font-family="-apple-system, sans-serif" font-size="13" text-anchor="middle">RFC 7868 Loop-Free Convergence, Feasible Successor Selection &amp; EIGRP Stub Boundary</text>

  <!-- Source Router Node -->
  <rect x="375" y="100" width="250" height="110" rx="10" fill="url(#nodeGrad)" stroke="#a855f7" stroke-width="2" />
  <rect x="390" y="115" width="220" height="26" rx="4" fill="url(#purpleGrad)" />
  <text x="500" y="133" fill="#050811" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Source Router (R0)</text>
  <text x="390" y="165" fill="#cbd5e1" font-family="monospace" font-size="11">Current FD_best = 28,160</text>
  <text x="390" y="185" fill="#c084fc" font-family="monospace" font-size="10">Variance = 1 | HMAC-SHA-256 Active</text>

  <!-- Path 1: Primary Successor (Router A) -->
  <rect x="50" y="270" width="260" height="180" rx="10" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="2" />
  <rect x="65" y="285" width="230" height="26" rx="4" fill="rgba(16, 185, 129, 0.2)" />
  <text x="180" y="303" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Router A (Primary Successor)</text>
  <text x="70" y="335" fill="#cbd5e1" font-family="monospace" font-size="11">Advertised Distance (AD): 25,600</text>
  <text x="70" y="355" fill="#cbd5e1" font-family="monospace" font-size="11">Local Link Cost: 2,560</text>
  <text x="70" y="375" fill="#34d399" font-family="monospace" font-weight="bold" font-size="11">Calculated FD: 28,160</text>
  <rect x="65" y="400" width="230" height="30" rx="4" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" />
  <text x="180" y="420" fill="#34d399" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓ SUCCESSOR (Installed in RIB)</text>

  <!-- Path 2: Feasible Successor (Router B) -->
  <rect x="370" y="270" width="260" height="180" rx="10" fill="url(#nodeGrad)" stroke="#06b6d4" stroke-width="2" />
  <rect x="385" y="285" width="230" height="26" rx="4" fill="rgba(6, 182, 212, 0.2)" />
  <text x="500" y="303" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Router B (Feasible Successor)</text>
  <text x="390" y="335" fill="#cbd5e1" font-family="monospace" font-size="11">Advertised Distance (AD): 26,880</text>
  <text x="390" y="355" fill="#cbd5e1" font-family="monospace" font-size="11">Local Link Cost: 3,840</text>
  <text x="390" y="375" fill="#22d3ee" font-family="monospace" font-weight="bold" font-size="11">Calculated FD: 30,720</text>
  <rect x="385" y="400" width="230" height="30" rx="4" fill="rgba(6, 182, 212, 0.15)" stroke="#06b6d4" />
  <text x="500" y="420" fill="#22d3ee" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✓ FEASIBLE SUCCESSOR (AD &lt; FD)</text>

  <!-- Path 3: Loop Risk (Router C) -->
  <rect x="690" y="270" width="260" height="180" rx="10" fill="url(#nodeGrad)" stroke="#ef4444" stroke-width="2" />
  <rect x="705" y="285" width="230" height="26" rx="4" fill="rgba(239, 68, 68, 0.2)" />
  <text x="820" y="303" fill="#f87171" font-family="sans-serif" font-weight="bold" font-size="12" text-anchor="middle">Router C (Fails Feasibility)</text>
  <text x="710" y="335" fill="#f87171" font-family="monospace" font-size="11">Advertised Distance (AD): 35,840</text>
  <text x="710" y="355" fill="#cbd5e1" font-family="monospace" font-size="11">Local Link Cost: 5,120</text>
  <text x="710" y="375" fill="#f8fafc" font-family="monospace" font-size="11">Calculated FD: 40,960</text>
  <rect x="705" y="400" width="230" height="30" rx="4" fill="rgba(239, 68, 68, 0.15)" stroke="#ef4444" />
  <text x="820" y="420" fill="#f87171" font-family="sans-serif" font-weight="bold" font-size="11" text-anchor="middle">✗ NOT FEASIBLE (AD &gt;= FD: Loop!)</text>

  <!-- Destination Node -->
  <rect x="350" y="520" width="300" height="90" rx="10" fill="url(#nodeGrad)" stroke="#fbbf24" stroke-width="2" />
  <text x="500" y="545" fill="#fbbf24" font-family="monospace" font-weight="bold" font-size="13" text-anchor="middle">Destination Prefix: 10.200.1.0/24</text>
  <text x="500" y="570" fill="#cbd5e1" font-family="sans-serif" font-size="11" text-anchor="middle">EIGRP Stub Active: Branch does not receive routing queries.</text>
  <text x="500" y="590" fill="#34d399" font-family="monospace" font-size="10" text-anchor="middle">✓ Halts Stuck-in-Active (SIA) Cascades Across WAN</text>

  <!-- Connectors -->
  <line x1="420" y1="210" x2="200" y2="270" stroke="#10b981" stroke-width="2" />
  <line x1="500" y1="210" x2="500" y2="270" stroke="#06b6d4" stroke-width="2" />
  <line x1="580" y1="210" x2="800" y2="270" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" />

  <line x1="200" y1="450" x2="420" y2="520" stroke="#10b981" stroke-width="2" />
  <line x1="500" y1="450" x2="500" y2="520" stroke="#06b6d4" stroke-width="2" />
  <line x1="800" y1="450" x2="580" y2="520" stroke="#ef4444" stroke-width="2" stroke-dasharray="4" />
</svg>
